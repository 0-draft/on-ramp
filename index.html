<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>On-ramp — every way from your network into AWS</title>
    <meta
      name="description"
      content="Every network path between a corporate network and AWS, drawn as a road map: Site-to-Site VPN, Direct Connect, SD-WAN, Transit Gateway and Cloud WAN, PrivateLink, hybrid DNS, Client VPN, Verified Access and the internet. Bilingual (EN/JA)."
    />
    <meta name="theme-color" content="#006b4f" />
    <script>
      // Apply a saved theme before first paint so it never flashes.
      try {
        const t = localStorage.getItem("on-ramp:theme");
        if (t === "light" || t === "dark") document.documentElement.dataset.theme = t;
      } catch {}
    </script>
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Overpass:wght@400;600;700;800;900&family=Overpass+Mono:wght@400;600&family=BIZ+UDPGothic:wght@400;700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
